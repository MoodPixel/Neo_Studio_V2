name: Phase 6 MiniMax H3 LoRA Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - "neo_app/video/**"
      - "neo_extensions/built_in/video.lora_stack/**"
      - "tests/test_minimax_h3_lora_regression_phase6.py"
      - ".github/workflows/phase6_minimax_h3_lora_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase6-h3-lora-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Neo import dependencies
        run: |
          python -m pip install "pydantic>=2,<3" pillow
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile Phase 6 Python files
        run: |
          python -m py_compile \
            neo_app/video/video_lora_runtime.py \
            neo_app/video/minimax_h3_lora_integration.py \
            neo_app/video/minimax_h3_lora_regression.py \
            tests/test_minimax_h3_lora_regression_phase6.py

      - name: Run Phase 6 regression module
        run: python -m neo_app.video.minimax_h3_lora_regression

      - name: Run Phase 6 unittest gate
        run: python -m unittest tests.test_minimax_h3_lora_regression_phase6 -v

      - name: Package Phase 6 changed/new files only
        run: |
          zip -r NeoStudio_Phase6_MiniMax_H3_LoRA_Regression_ChangeOnly.zip \
            .github/workflows/phase6_minimax_h3_lora_regression.yml \
            guides/02_VIDEO/README.md \
            guides/02_VIDEO/minimax_h3_lora_regression.md \
            guides/02_VIDEO/video_lora_stack.md \
            neo_app/video/minimax_h3_lora_integration.py \
            neo_app/video/minimax_h3_lora_regression.py \
            neo_app/video/video_lora_runtime.py \
            neo_extensions/built_in/video.lora_stack/extension_manifest.json \
            neo_system_records/06_SURFACES/video/VIDEO_LORA_STACK_PHASE6_REGRESSION.md \
            tests/test_minimax_h3_lora_regression_phase6.py

      - name: Upload verified Phase 6 change-only ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NeoStudio_Phase6_MiniMax_H3_LoRA_Regression_ChangeOnly
          path: NeoStudio_Phase6_MiniMax_H3_LoRA_Regression_ChangeOnly.zip
          if-no-files-found: error
          retention-days: 7
